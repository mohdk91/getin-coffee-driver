name: getin_driver
description: "Getin Coffee Driver App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: 2.3.3
  flutter_secure_storage: ^10.3.4
  package_info_plus: ^8.0.2
  country_picker: ^2.0.27
  url_launcher: 6.2.6
  file_picker: 8.1.4
  geolocator: 13.0.2
  firebase_core: 4.7.0
  firebase_messaging: 16.2.0
  video_player: 2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/getin_logo_mark.png
    - assets/images/onboarding/
    - assets/images/branches/
    - assets/images/splash/
    - assets/video/
